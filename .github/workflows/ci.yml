name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 安装python
        uses: actions/setup-python@v6.2
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install pytest requests

      - name: 跑测试
        run: pytest -v

